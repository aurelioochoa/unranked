<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Barlow:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; }
    a { color: #D4A855; } a:hover { color: #E8C687; }
    .rule { height: 1px; background: rgba(212,168,85,.22); }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; background: #0A0710; color: #E5DDEE; overflow: hidden;">
  <div style="position:absolute; inset:0; background: radial-gradient(110% 48% at 50% 0%, rgba(124,58,237,.22), transparent 62%);"></div>

  <div style="position: relative; display: flex; flex-direction: column; height: 100%;">
    <div style="padding: 30px 28px 0; display:flex; align-items:baseline; justify-content: space-between;">
      <div style="font-family:'Cormorant Garamond', serif; font-size: 15px; font-weight: 400; letter-spacing: .42em; color: #D4A855;">MONARCH</div>
      <div style="font-size: 10px; letter-spacing: .24em; color: #6B5C82;">RANK C</div>
    </div>

    <div style="margin-top: 40px; padding: 0 28px;">
      <div style="font-family:'Cormorant Garamond', serif; font-size: 40px; font-weight: 300; letter-spacing: .1em; line-height: 1; color: #F4EFFA;">Aurelio</div>
      <div style="margin-top: 8px; font-size: 11px; letter-spacing: .2em; color: #8A79A6;">SHADOW · LEVEL 14</div>
    </div>

    <div style="margin: 30px 28px 0;">
      <div style="display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px;">
        <span style="font-size: 10px; letter-spacing: .26em; color: #6B5C82;">EXPERIENCE</span>
        <span style="font-family:'Cormorant Garamond', serif; font-size: 17px; color: #D4A855;">71%</span>
      </div>
      <div style="height: 1px; background: rgba(212,168,85,.16);">
        <div style="width: 71%; height: 1px; background: #D4A855;"></div>
      </div>
    </div>

    <div style="margin: 44px 28px 0; display:flex; flex-direction: column; gap: 0;">
      <div style="font-size: 10px; letter-spacing: .26em; color: #6B5C82; margin-bottom: 16px;">ABILITIES</div>

      <div style="display:flex; justify-content: space-between; align-items: baseline; padding-bottom: 13px;">
        <span style="font-size: 13px; letter-spacing: .1em; color: #B6A8CC;">Strength</span>
        <span style="font-family:'Cormorant Garamond', serif; font-size: 25px; color: #F4EFFA;">24</span>
      </div>
      <div class="rule"></div>
      <div style="display:flex; justify-content: space-between; align-items: baseline; padding: 13px 0;">
        <span style="font-size: 13px; letter-spacing: .1em; color: #B6A8CC;">Vitality</span>
        <span style="font-family:'Cormorant Garamond', serif; font-size: 25px; color: #F4EFFA;">19</span>
      </div>
      <div class="rule"></div>
      <div style="display:flex; justify-content: space-between; align-items: baseline; padding: 13px 0;">
        <span style="font-size: 13px; letter-spacing: .1em; color: #B6A8CC;">Agility</span>
        <span style="font-family:'Cormorant Garamond', serif; font-size: 25px; color: #F4EFFA;">31</span>
      </div>
      <div class="rule"></div>
      <div style="display:flex; justify-content: space-between; align-items: baseline; padding: 13px 0;">
        <span style="font-size: 13px; letter-spacing: .1em; color: #B6A8CC;">Intelligence</span>
        <span style="font-family:'Cormorant Garamond', serif; font-size: 25px; color: #F4EFFA;">40</span>
      </div>
      <div class="rule"></div>
      <div style="display:flex; justify-content: space-between; align-items: baseline; padding: 13px 0;">
        <span style="font-size: 13px; letter-spacing: .1em; color: #B6A8CC;">Perception</span>
        <span style="font-family:'Cormorant Garamond', serif; font-size: 25px; color: #F4EFFA;">12</span>
      </div>
      <div class="rule"></div>
      <div style="display:flex; justify-content: space-between; align-items: baseline; padding-top: 13px;">
        <span style="font-size: 13px; letter-spacing: .1em; color: #D4A855;">Craft</span>
        <span style="font-family:'Cormorant Garamond', serif; font-size: 25px; color: #D4A855;">28</span>
      </div>
    </div>

    <div style="margin: 40px 28px 0; padding: 15px 0; border-top: 1px solid rgba(212,168,85,.22); border-bottom: 1px solid rgba(212,168,85,.22); text-align: center;">
      <div style="font-family:'Cormorant Garamond', serif; font-size: 16px; font-style: italic; color: #D4A855;">Five points remain unassigned.</div>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="display:flex; justify-content: space-between; padding: 0 28px 34px; font-size: 10px; letter-spacing: .22em; color: #6B5C82;">
      <span style="color: #D4A855;">STATUS</span><span>QUESTS</span><span>DUNGEON</span><span>SYSTEM</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
